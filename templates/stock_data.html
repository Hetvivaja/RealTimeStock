{% extends "base.html" %}

{% block title %}{{ symbol }} Chart | RealStock Market{% endblock %}

{% block content %}
<section class="page-hero compact stock-heading">
    <div>
        <p class="eyebrow">Interactive quote</p>
        <h1>{{ symbol }}</h1>
        <p>Switch chart types and time periods to review recent price action.</p>
    </div>
    <a class="secondary-action" href="{{ url_for('top_stock') }}">Browse Top Stocks</a>
</section>

<section class="chart-shell">
    <iframe
        title="{{ symbol }} interactive stock chart"
        src="/dash/stock/{{ symbol }}"
        class="chart-frame"
        loading="lazy">
    </iframe>
</section>
{% endblock %}
