<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ symbol }} Stock Chart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="/">Home</a>
            <a href="/top-stocks">Top Stocks</a>
        </div>
        <div class="nav-right">
            <form action="{{ url_for('search') }}" method="get" class="search-form">
                <input type="text" name="query" placeholder="Search stock symbol..." required>
                <button type="submit">Search</button>
            </form>
        </div>
    </nav>

    <h2 style="text-align: center;">Stock Chart for {{ symbol }}</h2>
    <iframe src="/dash/stock/{{ symbol }}" width="100%" height="600" frameborder="0"></iframe>
</body>
</html>
